  <body>
    <button class="phone-num">
      <p class="basic-button">
        Phone: 281-300-2544
      </p>
    </button>
    <button class="mail">
      <p class="basic-button">
        Email: info@jp-pool.com
      </p>
    </button>

    <div class="line1">
    </div>

    <div class="request-form-cont">
      <p class="form-title">
        CONTACT US:
      </p>
      <form class="form-entry" action="/send-sms" method="POST">
        <label for="name">Name:</label>
        <input class="form-field" type="text" id="name" name="name" required><br><br>

        <label for="phone">Phone:</label>
        <input class="form-field" type="tel" id="phone" name="phone" required><br><br>

        <label for="email">Email:</label>
        <input class="form-field" type="email" id="email" name="email"><br><br>

        <label for="adress">Adress:</label>
        <input class="form-field" type="text" id="adress" name="adress" required><br><br>

        <label for="service">Service:</label>
        <select class="form-field" id="service" name="service" required>
          <option value="" disabled selected>Select a service</option>
          <option value="new-plaster">New Pool Plaster</option>
          <option value="replaster">Replastering</option>
          <option value="tile-coping">Tile & Coping</option>
          <option value="deck-resurfacing">Deck Resurfacing</option>
          <option value="acid-wash">Acid Wash / Cleaning</option>
          <option value="inspection">Pool Inspection / Consultation</option>
        </select><br><br>

        <label for="sms">Would you like to receive sms updates?</label>
        <input class="form-field" type="checkbox" id="sms" name="sms" checked><br><br>

        <input class="form-field-submit" type="submit" value="Submit">
      </form>
    </div>

    <iframe class="map" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3459.273122692279!2d-95.36067332419913!3d29.885229875004182!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8640b799250874a1%3A0x5e975b715354d061!2s1831%20Hartwick%20Rd%2C%20Houston%2C%20TX%2077093!5e0!3m2!1sen!2sus!4v1749546559912!5m2!1sen!2sus" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
