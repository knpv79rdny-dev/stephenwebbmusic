  <body>
    <button class="phone-num">
      <p class="basic-button">
        Phone: (281)757-6348
      </p>
    </button>
    <button class="mail">
      <p class="basic-button">
        Email: s.w.music@outlook.com
      </p>
    </button>

    <div class="line1">
    </div>

    <div class="request-form-cont">
      <p class="form-title">
        CONTACT US:
      </p>
      <form class="form-entry" action="/send-sms" method="POST">
        <label for="name">Name:</label>
        <input class="form-field" type="text" id="name" name="name" required><br><br>

        <label for="phone">Phone:</label>
        <input class="form-field" type="tel" id="phone" name="phone" required><br><br>

        <label for="email">Email:</label>
        <input class="form-field" type="email" id="email" name="email"><br><br>

        <label for="service">Lessons:</label>
        <select class="form-field" id="service" name="service" required>
          <option value="" disabled selected>Select a time</option>
          <option value="new-plaster">1 hour - $65</option>
          <option value="replaster">30 minutes - $45</option>
          <option value="tile-coping">1 hour / virtual - $50</option>
          <option value="deck-resurfacing">30 minutes / virtual - $35</option>
          <option value="acid-wash">1 hour / in home - $100</option>
          <option value="inspection">30 minutes / in home - $75</option>
        </select><br><br>

        <label for="sms">Would you like to receive sms updates?</label>
        <input class="form-field" type="checkbox" id="sms" name="sms" checked><br><br>

        <input class="form-field-submit" type="submit" value="Submit">
      </form>
    </div>

    <iframe class="map" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3441.64755583762!2d-95.3263738!3d30.3893644!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x86474196c9d91d6f%3A0x84ac29818ba723cb!2s15611%20Plum%20Brk%20Dr%2C%20Conroe%2C%20TX%2077303!5e0!3m2!1sen!2sus!4v1779753899569!5m2!1sen!2sus" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>

      Conroe, TX 77303
    </p>
